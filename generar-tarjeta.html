<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Tarjeta - El Rincón de Mariana</title>
    <style>
        body { 
            font-family: 'Nunito', sans-serif; 
            background: linear-gradient(135deg, #FFF8E7 0%, #F5E6D3 100%);
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0;
            padding: 20px;
        }
        .container { 
            background: white; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
        }
        h1 { color: #E67E22; font-family: 'Fredoka One', cursive; margin-bottom: 20px; }
        .icon { font-size: 64px; margin-bottom: 20px; }
        p { color: #666; font-size: 16px; line-height: 1.6; margin-bottom: 25px; }
        a { 
            display: inline-block; 
            background: #E67E22; 
            color: white; 
            padding: 15px 30px; 
            text-decoration: none; 
            border-radius: 50px; 
            font-weight: bold;
            font-size: 18px;
            transition: all 0.3s;
        }
        a:hover { background: #D35400; transform: translateY(-3px); box-shadow: 0 6px 20px rgba(230, 126, 34, 0.4); }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎉</div>
        <h1>El Rincón de Mariana</h1>
        <p>
            <strong>Importante:</strong> Los certificados de fidelidad ahora se generan automáticamente al registrarte.
        </p>
        <p>
            Serás redirigido automáticamente a la página de registro en <span id="contador">5</span> segundos...
        </p>
        <a href="index.html#registro">Ir a Registrarme Ahora</a>
    </div>

    <script>
        // Redirección automática después de 5 segundos
        let segundos = 5;
        const contador = document.getElementById('contador');
        
        const intervalo = setInterval(() => {
            segundos--;
            contador.textContent = segundos;
            
            if (segundos <= 0) {
                clearInterval(intervalo);
                window.location.href = 'index.html#registro';
            }
        }, 1000);
    </script>
</body>
</html>
