<script>
    const SUPABASE_URL = 'https://nwuqdmbqlpmiyxiqdxmc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_yxX1XgJScGe_kIA8IucS0w_Viy6Q0bc';

    // Inicialización compatible con CDN v2
    const supabaseClient = window.supabase?.createClient 
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        : null;

    const loginScreen = document.getElementById('loginScreen');
    const dashboardScreen = document.getElementById('dashboardScreen');
    const errorMsg = document.getElementById('errorMsg');

    async function iniciarSesion() {
        errorMsg.style.display = 'none';
        
        if (!supabaseClient) {
            mostrarError('Error: No se pudo cargar la librería de Supabase.');
            return;
        }

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!email || !password) { 
            mostrarError('Por favor, completa todos los campos.'); 
            return; 
        }

        try {
            // 1. Autenticación con Supabase
            const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (authError) { 
                mostrarError('Error de acceso: ' + authError.message); 
                return; 
            }

            // 2. Consulta de empleado en la tabla 'empleados'
            const { data: emp, error: empError } = await supabaseClient
                .from('empleados')
                .select('nombre, rol, activo')
                .eq('email', email)
                .maybeSingle(); // evita lanzar excepción si no encuentra filas

            if (empError) {
                mostrarError('Error al consultar permisos: ' + empError.message);
                await supabaseClient.auth.signOut();
                return;
            }

            if (!emp) { 
                mostrarError('No tienes permisos registrados en la tabla de empleados.'); 
                await supabaseClient.auth.signOut(); 
                return; 
            }

            if (!emp.activo) { 
                mostrarError('Tu cuenta se encuentra desactivada.'); 
                await supabaseClient.auth.signOut(); 
                return; 
            }

            // 3. Renderizar Dashboard
            loginScreen.style.display = 'none';
            dashboardScreen.style.display = 'flex';
            document.getElementById('welcomeName').textContent = 'Hola, ' + emp.nombre;
            document.getElementById('welcomeRole').textContent = 'Rol: ' + emp.rol;

        } catch (err) { 
            mostrarError('Error inesperado: ' + err.message); 
        }
    }

    function mostrarError(msg) { 
        errorMsg.textContent = msg; 
        errorMsg.style.display = 'block'; 
    }

    async function cerrarSesion() {
        if (supabaseClient) await supabaseClient.auth.signOut();
        dashboardScreen.style.display = 'none';
        loginScreen.style.display = 'flex';
        errorMsg.style.display = 'none';

    }
</script>
