<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - El Rincón de Mariana</title>
    <!-- Supabase y Lector QR -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f4f4f4; min-height: 100vh; display: flex; flex-direction: column; }
        .login-screen { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; background: white; }
        .login-box { width: 100%; max-width: 350px; text-align: center; }
        .login-box h1 { color: #E67E22; margin-bottom: 10px; }
        .login-box p { color: #666; margin-bottom: 25px; font-size: 14px; }
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; font-weight: bold; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 15px; }
        .btn-login { width: 100%; padding: 12px; background: #E67E22; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .btn-secondary { width: 100%; padding: 10px; background: #5D4037; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .error-msg { color: #e74c3c; font-size: 13px; margin-top: 15px; background: #fde8e8; padding: 10px; border-radius: 5px; display: none; }
        
        .dashboard-screen { display: none; flex: 1; flex-direction: column; }
        .header-panel { background: #E67E22; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .welcome-card { background: white; padding: 15px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .action-btn { width: 100%; padding: 15px; background: white; border: 2px solid #E67E22; border-radius: 10px; color: #E67E22; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; }
        .action-btn.primary { background: #E67E22; color: white; }
        
        .view-section { display: none; background: white; padding: 20px; border-radius: 10px; flex: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.05); overflow-y: auto; max-height: 80vh; }
        .view-section h3 { color: #E67E22; margin-bottom: 15px; }
        .back-btn { background: #666; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-size: 14px; cursor: pointer; margin-bottom: 15px; }
        
        /* Tarjeta de cliente */
        .client-card { display: flex; flex-direction: column; padding: 12px; border-bottom: 1px solid #eee; gap: 8px; }
        .client-main-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .client-info { flex: 1; font-size: 14px; color: #333; line-height: 1.5; }
        .client-qr-box { text-align: center; background: #fafafa; padding: 6px; border: 1px solid #ddd; border-radius: 6px; }
        .client-qr-box img { width: 75px; height: 75px; object-fit: contain; display: block; margin: 0 auto 4px auto; }
        .client-qr-code { font-size: 9px; font-family: monospace; color: #E67E22; font-weight: bold; }

        /* Insignia de Promoción */
        .promo-badge { background: #27ae60; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; margin-top: 5px; }
        .promo-pending { background: #f39c12; color: white; padding: 3px 8px; border-radius: 15px; font-size: 11px; display: inline-block; margin-top: 5px; }

        /* Botón de WhatsApp */
        .btn-whatsapp { display: inline-flex; align-items: center; gap: 5px; background: #25D366; color: white; text-decoration: none; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-top: 5px; width: fit-content; }
        .btn-whatsapp:hover { background: #1eb857; }

        .data-item { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; color: #333; line-height: 1.5; }
        .form-box { background: #fdf8f2; padding: 15px; border-radius: 10px; border: 1px solid #E67E22; margin-top: 15px; }
        .form-box h4 { color: #5D4037; margin-bottom: 10px; font-size: 15px; }
    </style>
</head>
<body>
    <!-- Login -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h1>El Rincón de Mariana</h1>
            <p>Panel de Control Interno</p>
            <div class="input-group">
                <label>Correo electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com">
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button class="btn-login" onclick="iniciarSesion()">Ingresar al Panel</button>
            <div id="errorMsg" class="error-msg"></div>
        </div>
    </div>
    
    <!-- Panel Principal -->
    <div id="dashboardScreen" class="dashboard-screen">
        <div class="header-panel">
            <h2>Panel de Control</h2>
            <button onclick="cerrarSesion()" style="background:rgba(255,255,255,0.2);border:1px solid white;color:white;padding:6px 12px;border-radius:5px;cursor:pointer;">Salir</button>
        </div>
        
        <div class="main-content">
            <div id="homeMenu" style="display: flex; flex-direction: column; gap: 12px; flex: 1;">
                <div class="welcome-card">
                    <h3 id="welcomeName">Bienvenido</h3>
                    <p style="font-size: 13px; color: #666;">Sistema Activo</p>
                </div>
                
                <button class="action-btn primary" onclick="abrirEscanerQR()">📷 Escanear Código QR</button>
                <button class="action-btn" onclick="verListaClientes()">👥 Ver Lista de Clientes</button>
                <button class="action-btn" onclick="verVisitas()">📋 Ver Historial de Visitas</button>
                <button class="action-btn" onclick="verTransacciones()">💰 Ver Transacciones</button>
                <button class="action-btn" onclick="abrirBuscadorCedula()">🔍 Buscar por Cédula / Editar</button>
            </div>

            <!-- Vista: Clientes -->
            <div id="clientsView" class="view-section">
                <button class="back-btn" onclick="volverAlMenu()">← Volver</button>
                <h3>Lista de Clientes Registrados</h3>
                <div id="clientsListContainer">Cargando...</div>
            </div>

            <!-- Vista: Visitas -->
            <div id="visitsView" class="view-section">
                <button class="back-btn" onclick="volverAlMenu()">← Volver</button>
                <h3>Historial de Visitas</h3>
                <div id="visitsListContainer">Cargando...</div>
            </div>

            <!-- Vista: Transacciones -->
            <div id="transactionsView" class="view-section">
                <button class="back-btn" onclick="volverAlMenu()">← Volver</button>
                <h3>Registro de Transacciones</h3>
                <div id="transactionsListContainer">Cargando...</div>
            </div>

            <!-- Vista: Búsqueda y Edición Manual -->
            <div id="searchView" class="view-section">
                <button class="back-btn" onclick="volverAlMenu()">← Volver</button>
                <h3>Consulta y Gestión de Cliente</h3>
                <div class="input-group">
                    <input type="text" id="cedulaInput" placeholder="Introduce la cédula o escanea un QR...">
                </div>
                <button class="btn-login" onclick="buscarCedula()" style="margin-bottom: 15px;">Buscar Cliente</button>
                <div id="searchResultContainer"></div>
            </div>
        </div>
    </div>

    <div id="qrReader" style="display: none;"></div>
    <input type="file" id="qrFileInput" accept="image/*" capture="environment" style="display: none;" onchange="procesarArchivoQR(event)">

    <script>
        const SUPABASE_URL = 'https://nwuqdmbqlpmiyxiqdxmc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_yxX1XgJScGe_kIA8IucS0w_Viy6Q0bc';
        
        let db = null;
        let html5QrCode = null;
        let clienteActual = null;

        window.addEventListener('DOMContentLoaded', () => {
            try {
                if (window.supabase) {
                    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                } else {
                    mostrarError('No se pudo cargar la librería de autenticación.');
                }
            } catch (e) {
                mostrarError('Error de inicialización: ' + e.message);
            }
        });

        function mostrarError(msg) {
            const errorDiv = document.getElementById('errorMsg');
            if (errorDiv) {
                errorDiv.textContent = msg;
                errorDiv.style.display = 'block';
            }
        }

        async function iniciarSesion() {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            if (!db) {
                mostrarError('El sistema no está conectado con la base de datos.');
                return;
            }

            const emailInput = document.getElementById('email').value.trim().toLowerCase();
            const passwordInput = document.getElementById('password').value.trim();

            if (!emailInput || !passwordInput) {
                mostrarError('Por favor, completa todos los campos.');
                return;
            }

            try {
                const { data: authData, error: authError } = await db.auth.signInWithPassword({
                    email: emailInput,
                    password: passwordInput
                });

                if (authError) {
                    mostrarError('Error de Autenticación: ' + authError.message);
                    return;
                }

                const { data: emp, error: empError } = await db
                    .from('empleados')
                    .select('nombre, email')
                    .eq('email', emailInput)
                    .maybeSingle();

                if (empError) {
                    mostrarError('Error en tabla empleados: ' + empError.message);
                    await db.auth.signOut();
                    return;
                }

                if (!emp) {
                    mostrarError('El correo no se encontró en la tabla empleados.');
                    await db.auth.signOut();
                    return;
                }

                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'flex';
                document.getElementById('welcomeName').textContent = 'Hola, ' + (emp.nombre || 'Empleado');

            } catch (err) {
                mostrarError('Excepción imprevista: ' + err.message);
            }
        }

        async function cerrarSesion() {
            if (db) await db.auth.signOut();
            document.getElementById('dashboardScreen').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            document.getElementById('errorMsg').style.display = 'none';
            volverAlMenu();
        }

        function volverAlMenu() {
            document.getElementById('homeMenu').style.display = 'flex';
            document.getElementById('clientsView').style.display = 'none';
            document.getElementById('visitsView').style.display = 'none';
            document.getElementById('transactionsView').style.display = 'none';
            document.getElementById('searchView').style.display = 'none';
        }

        function abrirEscanerQR() {
            document.getElementById('qrFileInput').click();
        }

        async function procesarArchivoQR(event) {
            const file = event.target.files[0];
            if (!file) return;

            abrirBuscadorCedula();
            const resultContainer = document.getElementById('searchResultContainer');
            resultContainer.innerHTML = 'Leyendo código QR...';

            try {
                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("qrReader");
                }
                const qrCodeMessage = await html5QrCode.scanFile(file, true);
                
                document.getElementById('cedulaInput').value = qrCodeMessage;
                resultContainer.innerHTML = `<p style="color:green; margin-bottom: 10px;"><strong>QR Escaneado:</strong> ${qrCodeMessage}</p>`;
                
                buscarCedula();

            } catch (err) {
                resultContainer.innerHTML = '<p style="color:red;">No se pudo detectar un código QR claro en la imagen capturada.</p>';
            }
        }

        // Generar enlace de WhatsApp según estado de deuda
        function generarLinkWhatsApp(telefonoRaw, nombre, deuda) {
            if (!telefonoRaw) return '#';
            let tel = telefonoRaw.replace(/\D/g, ''); // Limpiar caracteres
            if (!tel.startsWith('58') && tel.length === 10) tel = '58' + tel; // Formato Venezuela por defecto
            
            let mensaje = '';
            if (deuda > 0) {
                mensaje = `Hola ${nombre}, te saludamos de El Rincón de Mariana. Te recordamos que tienes un saldo pendiente por pagar de $${deuda.toFixed(2)}. Quedamos a tu disposición. ¡Muchas gracias!`;
            } else {
                mensaje = `Hola ${nombre}, te saludamos de El Rincón de Mariana. Queremos informarte que tu cuenta se encuentra totalmente al día. ¡Gracias por tu preferencia!`;
            }

            return `https://wa.me/${tel}?text=${encodeURIComponent(mensaje)}`;
        }

        // VER LISTA DE CLIENTES
        async function verListaClientes() {
            document.getElementById('homeMenu').style.display = 'none';
            document.getElementById('clientsView').style.display = 'block';
            const container = document.getElementById('clientsListContainer');
            container.innerHTML = 'Cargando clientes...';

            try {
                const { data, error } = await db.from('clientes').select('*').limit(50);
                if (error) { container.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`; return; }
                if (!data || data.length === 0) { container.innerHTML = '<p>No hay clientes registrados.</p>'; return; }

                let html = '';
                data.forEach(c => {
                    const nombreCliente = c.nombre_y_apellido || c.nombre || 'Sin nombre';
                    const telefono = c.telefono || 'Sin teléfono';
                    const cedula = c.cedula || 'Sin cédula';
                    const puntos = c.puntos !== undefined && c.puntos !== null ? c.puntos : 0;
                    const deuda = c.deuda_actual !== undefined && c.deuda_actual !== null ? parseFloat(c.deuda_actual) : 0;
                    
                    const codigoQRTexto = c.codigo_qr || `ERM-${cedula}`;
                    const qrURL = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(codigoQRTexto)}`;
                    const linkWA = generarLinkWhatsApp(telefono, nombreCliente, deuda);

                    // Indicador Promocional (>= 5 visitas para la 6ta gratis)
                    let promoHTML = '';
                    if (puntos >= 5) {
                        promoHTML = `<div class="promo-badge">🎉 ¡Acreedor de Promoción! (6ta visita GRATIS)</div>`;
                    } else {
                        promoHTML = `<div class="promo-pending">Visitas acumuladas: ${puntos}/5 (faltan ${5 - puntos} para regalía)</div>`;
                    }

                    html += `
                    <div class="client-card">
                        <div class="client-main-row">
                            <div class="client-info">
                                <strong>${nombreCliente}</strong><br>
                                <small><strong>Cédula:</strong> ${cedula}</small><br>
                                <small><strong>Teléfono:</strong> ${telefono}</small><br>
                                <small><strong>Deuda actual:</strong> $${deuda.toFixed(2)}</small><br>
                                ${promoHTML}
                            </div>
                            <div class="client-qr-box">
                                <img src="${qrURL}" alt="QR Code">
                                <div class="client-qr-code">${codigoQRTexto}</div>
                            </div>
                        </div>
                        ${c.telefono ? `<a href="${linkWA}" target="_blank" class="btn-whatsapp">💬 Enviar WhatsApp (Deuda: $${deuda.toFixed(2)})</a>` : ''}
                    </div>`;
                });
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = '<p style="color:red;">Error de conexión.</p>';
            }
        }

        async function verVisitas() {
            document.getElementById('homeMenu').style.display = 'none';
            document.getElementById('visitsView').style.display = 'block';
            const container = document.getElementById('visitsListContainer');
            container.innerHTML = 'Cargando visitas...';

            try {
                const { data, error } = await db.from('visitas').select('*').limit(50);
                if (error) { container.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`; return; }
                if (!data || data.length === 0) { container.innerHTML = '<p>No hay visitas registradas.</p>'; return; }

                let html = '';
                data.forEach(v => {
                    html += `<div class="data-item">
                        <strong>Tipo:</strong> ${v.tipo || 'normal'} | <strong>Monto:</strong> $${v.monto_consumo || 0} <br>
                        <small>Fecha: ${v.fecha ? new Date(v.fecha).toLocaleString() : 'N/A'} | Válida: ${v.es_valida ? 'Sí' : 'No'}</small><br>
                        <em>Notas: ${v.notas || 'Sin notas'}</em>
                    </div>`;
                });
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = '<p style="color:red;">Error al cargar visitas.</p>';
            }
        }

        async function verTransacciones() {
            document.getElementById('homeMenu').style.display = 'none';
            document.getElementById('transactionsView').style.display = 'block';
            const container = document.getElementById('transactionsListContainer');
            container.innerHTML = 'Cargando transacciones...';

            try {
                const { data, error } = await db.from('transacciones').select('*').limit(50);
                if (error) { container.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`; return; }
                if (!data || data.length === 0) { container.innerHTML = '<p>No hay transacciones registradas.</p>'; return; }

                let html = '';
                data.forEach(t => {
                    html += `<div class="data-item">
                        <strong>Tipo:</strong> ${t.tipo || 'General'} | <strong>Monto:</strong> $${t.monto
