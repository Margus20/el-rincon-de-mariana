<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel - El Rincón de Mariana</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f4f4f4; min-height: 100vh; display: flex; flex-direction: column; }
        .login-screen { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; background: white; }
        .login-box { width: 100%; max-width: 350px; text-align: center; }
        .login-box h1 { color: #E67E22; margin-bottom: 10px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: bold; }
        .input-group input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        .btn-login { width: 100%; padding: 14px; background: #E67E22; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .error-msg { color: #e74c3c; font-size: 13px; margin-top: 15px; background: #fde8e8; padding: 10px; border-radius: 5px; display: none; text-align: center; }
        
        .dashboard-screen { display: none; flex: 1; flex-direction: column; }
        .header-panel { background: #E67E22; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .welcome-card { background: white; padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .action-btn { width: 100%; padding: 18px; background: white; border: 2px solid #E67E22; border-radius: 10px; color: #E67E22; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .action-btn.primary { background: #E67E22; color: white; }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h1>El Rincón de Mariana</h1>
            <p>Panel de Control Interno</p>
            <div class="input-group">
                <label>Correo electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com">
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button class="btn-login" onclick="iniciarSesion()">Ingresar al Panel</button>
            <div id="errorMsg" class="error-msg"></div>
        </div>
    </div>
    
    <div id="dashboardScreen" class="dashboard-screen">
        <div class="header-panel">
            <h2>Panel de Control</h2>
            <button onclick="cerrarSesion()" style="background:rgba(255,255,255,0.2);border:1px solid white;color:white;padding:6px 12px;border-radius:5px;cursor:pointer;">Salir</button>
        </div>
        <div class="main-content">
            <div class="welcome-card">
                <h3 id="welcomeName">Bienvenido</h3>
                <p id="welcomeRole" style="color: #E67E22; font-weight: bold; margin-top: 5px;">Cargando perfil...</p>
            </div>
            <button class="action-btn primary" onclick="alert('Función de escáner lista para activar en el siguiente paso')">📷 Escanear Código QR</button>
            <button class="action-btn" onclick="alert('Lista de clientes lista para activar')">👥 Ver Lista de Clientes</button>
            <button class="action-btn" onclick="alert('Búsqueda lista para activar')">🔍 Buscar por Cédula</button>
        </div>
    </div>

    <script>
        // Esperamos a que toda la página y las librerías carguen antes de ejecutar nada
        window.addEventListener('DOMContentLoaded', () => {
            console.log("Página cargada correctamente");
        });

        const SUPABASE_URL = 'https://nwuqdmbqlpmiyxiqdxmc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_yxX1XgJScGe_kIA8IucS0w_Viy6Q0bc';
        
        // Inicializamos Supabase de forma segura
        const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        function mostrarError(msg) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
        }

        async function iniciarSesion() {
            document.getElementById('errorMsg').style.display = 'none';
            const emailInput = document.getElementById('email').value.trim().toLowerCase();
            const passwordInput = document.getElementById('password').value.trim();

            if (!emailInput || !passwordInput) {
                mostrarError('Por favor, completa todos los campos.');
                return;
            }

            if (!db) {
                mostrarError('Error: No se pudo conectar con la base de datos.');
                return;
            }

            try {
                // 1. Autenticar
                const { data: authData, error: authError } = await db.auth.signInWithPassword({ 
                    email: emailInput, 
                    password: passwordInput 
                });
                
                if (authError) {
                    mostrarError('Correo o contraseña incorrectos.');
                    return;
                }

                // 2. Verificar en tabla empleados
                const { data: emp, error: empError } = await db.from('empleados').select('nombre, rol').eq('email', emailInput).maybeSingle();
                
                if (empError || !emp) {
                    mostrarError('Usuario no encontrado en la base de datos de empleados.');
                    await db.auth.signOut();
                    return;
                }

                // 3. Mostrar el panel
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'flex';
                document.getElementById('welcomeName').textContent = 'Hola, ' + emp.nombre;
                document.getElementById('welcomeRole').textContent = 'Rol: ' + emp.rol.charAt(0).toUpperCase() + emp.rol.slice(1);

            } catch (err) {
                mostrarError('Error inesperado: ' + err.message);
            }
        }

        async function cerrarSesion() {
            if (db) await db.auth.signOut();
            document.getElementById('dashboardScreen').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            document.getElementById('errorMsg').style.display = 'none';
        }
    </script>
</body>
</html>
