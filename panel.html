<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - El Rincón de Mariana</title>
    <!-- Usamos un CDN alternativo y estable para Supabase v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f4f4f4; min-height: 100vh; display: flex; flex-direction: column; }
        .login-screen { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; background: white; }
        .login-box { width: 100%; max-width: 350px; text-align: center; }
        .login-box h1 { color: #E67E22; margin-bottom: 10px; }
        .login-box p { color: #666; margin-bottom: 25px; font-size: 14px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: bold; }
        .input-group input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        .btn-login { width: 100%; padding: 14px; background: #E67E22; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .error-msg { color: #e74c3c; font-size: 13px; margin-top: 15px; background: #fde8e8; padding: 10px; border-radius: 5px; display: none; }
        .dashboard-screen { display: none; flex: 1; flex-direction: column; }
        .header-panel { background: #E67E22; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .welcome-card { background: white; padding: 20px; border-radius: 10px; text-align: center; }
        .action-btn { width: 100%; padding: 18px; background: white; border: 2px solid #E67E22; border-radius: 10px; color: #E67E22; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .action-btn.primary { background: #E67E22; color: white; }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h1>El Rincón de Mariana</h1>
            <p>Panel de Control Interno</p>
            <div class="input-group">
                <label>Correo electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com">
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button class="btn-login" onclick="iniciarSesion()">Ingresar al Panel</button>
            <div id="errorMsg" class="error-msg"></div>
        </div>
    </div>
    
    <div id="dashboardScreen" class="dashboard-screen">
        <div class="header-panel">
            <h2>Panel de Control</h2>
            <button onclick="cerrarSesion()" style="background:rgba(255,255,255,0.2);border:1px solid white;color:white;padding:6px 12px;border-radius:5px;">Salir</button>
        </div>
        <div class="main-content">
            <div class="welcome-card">
                <h3 id="welcomeName">Bienvenido</h3>
                <p id="welcomeRole">Cargando...</p>
            </div>
            <button class="action-btn primary">📷 Escanear Código QR</button>
            <button class="action-btn">👥 Ver Lista de Clientes</button>
            <button class="action-btn">🔍 Buscar por Cédula</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nwuqdmbqlpmiyxiqdxmc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_yxX1XgJScGe_kIA8IucS0w_Viy6Q0bc';

        let supabase = null;

        // Comprobación segura de carga de Supabase
        try {
            if (window.supabase && typeof window.supabase.createClient === 'function') {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.error("Error al inicializar cliente Supabase:", e);
        }

        const loginScreen = document.getElementById('loginScreen');
        const dashboardScreen = document.getElementById('dashboardScreen');
        const errorMsg = document.getElementById('errorMsg');

        function mostrarError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }

        async function iniciarSesion() {
            errorMsg.style.display = 'none';

            if (!supabase) {
                mostrarError('Error crítico: La librería de Supabase no se cargó correctamente.');
                return;
            }

            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value.trim();

            if (!emailInput || !passwordInput) {
                mostrarError('Por favor, completa todos los campos.');
                return;
            }

            try {
                // Intentar autenticación
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: emailInput,
                    password: passwordInput
                });

                if (error) {
                    mostrarError('Credenciales incorrectas o error: ' + error.message);
                    return;
                }

                // Consultar tabla de empleados
                const { data: emp, error: empError } = await supabase
                    .from('empleados')
                    .select('nombre, rol, activo')
                    .eq('email', emailInput)
                    .maybeSingle();

                if (empError) {
                    mostrarError('Error al verificar empleado: ' + empError.message);
                    await supabase.auth.signOut();
                    return;
                }

                if (!emp) {
                    mostrarError('Este correo no está registrado como empleado autorizado.');
                    await supabase.auth.signOut();
                    return;
                }

                if (!emp.activo) {
                    mostrarError('Tu cuenta de empleado se encuentra desactivada.');
                    await supabase.auth.signOut();
                    return;
                }

                // Si todo es correcto, mostramos el panel
                loginScreen.style.display = 'none';
                dashboardScreen.style.display = 'flex';
                document.getElementById('welcomeName').textContent = 'Hola, ' + emp.nombre;
                document.getElementById('welcomeRole').textContent = 'Rol: ' + emp.rol;

            } catch (err) {
                mostrarError('Excepción de red o sistema: ' + err.message);
            }
        }

        async function cerrarSesion() {
            if (supabase) {
                await supabase.auth.signOut();
            }
            dashboardScreen.style.display = 'none';
            loginScreen.style.display = 'flex';
            errorMsg.style.display = 'none';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }
    </script>
</body>
</html>
