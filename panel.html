<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - El Rincón de Mariana</title>
    <!-- Lector QR -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f4f4f4; min-height: 100vh; display: flex; flex-direction: column; }
        .login-screen { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; background: white; }
        .login-box { width: 100%; max-width: 350px; text-align: center; }
        .login-box h1 { color: #E67E22; margin-bottom: 10px; }
        .login-box p { color: #666; margin-bottom: 25px; font-size: 14px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; font-weight: bold; }
        .input-group input, .input-group select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 15px; }
        
        .password-wrapper { position: relative; display: flex; align-items: center; }
        .password-wrapper input { padding-right: 50px; width: 100%; }
        .toggle-password { position: absolute; right: 8px; cursor: pointer; font-size: 18px; background: #eee; border: 1px solid #ccc; padding: 6px 10px; border-radius: 6px; user-select: none; }

        .btn-login { width: 100%; padding: 14px; background: #E67E22; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-secondary { width: 100%; padding: 10px; background: #5D4037; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .error-msg { color: #721c24; font-size: 13px; margin-top: 15px; background: #f8d7da; padding: 12px; border-radius: 6px; display: none; text-align: center; font-weight: bold; border: 1px solid #f5c6cb; }
        
        .dashboard-screen { display: none; flex: 1; flex-direction: column; }
        .header-panel { background: #E67E22; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .welcome-card { background: white; padding: 15px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .action-btn { width: 100%; padding: 15px; background: white; border: 2px solid #E67E22; border-radius: 10px; color: #E67E22; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; }
        .action-btn.primary { background: #E67E22; color: white; }
        
        .view-section { display: none; background: white; padding: 20px; border-radius: 10px; flex: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.05); overflow-y: auto; max-height: 80vh; }
        .view-section h3 { color: #E67E22; margin-bottom: 15px; }
        .back-btn { background: #666; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-size: 14px; cursor: pointer; margin-bottom: 15px; }
        
        .client-card { display: flex; flex-direction: column; padding: 15px; border: 1px solid #E67E22; background: #fdf8f2; border-radius: 10px; gap: 12px; margin-bottom: 15px; }
        .client-main-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .client-info { flex: 1; font-size: 14px; color: #333; line-height: 1.6; }
        .client-qr-box { text-align: center; background: #ffffff; padding: 8px; border: 2px solid #E67E22; border-radius: 8px; min-width: 95px; }
        .client-qr-box img { width: 80px; height: 80px; object-fit: contain; display: block; margin: 0 auto 4px auto; }
        .client-qr-code { font-size: 10px; font-family: monospace; color: #E67E22; font-weight: bold; word-break: break-all; }

        .promo-badge { background: #27ae60; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; margin-top: 5px; }
        .promo-pending { background: #f39c12; color: white; padding: 3px 8px; border-radius: 15px; font-size: 11px; display: inline-block; margin-top: 5px; }

        .btn-whatsapp { display: flex; align-items: center; justify-content: center; gap: 6px; background: #25D366; color: white; text-decoration: none; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; width: 100%; text-align: center; margin-top: 8px; }
        .data-item { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; color: #333; line-height: 1.5; background: #fafafa; border-radius: 8px; margin-bottom: 10px; }
        .form-box { background: #fdf8f2; padding: 15px; border-radius: 10px; border: 1px solid #E67E22; margin-top: 15px; margin-bottom: 15px; }
        .form-box h4 { color: #5D4037; margin-bottom: 10px; font-size: 15px; }
    </style>
</head>
<body>

    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h1>El Rincón de Mariana</h1>
            <p>Panel de Control Interno</p>
            
            <div class="input-group">
                <label>Correo electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com">
            </div>
            
            <div class="input-group">
                <label>Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="••••••••">
                    <button type="button" class="toggle-password" id="btnEye">👁️</button>
                </div>
            </div>
            
            <button type="button" class="btn-login" id="btnLogin">Ingresar al Panel</button>
            <div id="errorMsg" class="error-msg"></div>
        </div>
    </div>
    
    <div id="dashboardScreen" class="dashboard-screen">
        <div class="header-panel">
            <h2>Panel de Control</h2>
            <button id="btnLogout" style="background:rgba(255,255,255,0.2);border:1px solid white;color:white;padding:6px 12px;border-radius:5px;cursor:pointer;">Salir</button>
        </div>
        
        <div class="main-content">
            <div id="homeMenu" style="display: flex; flex-direction: column; gap: 12px; flex: 1;">
                <div class="welcome-card">
                    <h3 id="welcomeName">Bienvenido</h3>
                    <p style="font-size: 13px; color: #666;">Sistema Activo</p>
                </div>
                
                <button class="action-btn primary" id="btnEscaneoQR">📷 Escanear Código QR</button>
                <button class="action-btn" id="menuClientes">👥 Ver Lista de Clientes</button>
                <button class="action-btn" id="menuVisitas">📋 Ver Historial de Visitas</button>
                <button class="action-btn" id="menuTransacciones">💰 Ver Transacciones</button>
                <button class="action-btn" id="menuBuscador">🔍 Buscar por Cédula / Editar</button>
            </div>

            <!-- Vista Clientes -->
            <div id="clientsView" class="view-section">
                <button class="back-btn btnVolver">← Volver</button>
                <h3>Lista de Clientes Registrados</h3>
                <div id="clientsListContainer">Cargando...</div>
            </div>

            <!-- Vista Visitas -->
            <div id="visitsView" class="view-section">
                <button class="back-btn btnVolver">← Volver</button>
                <h3>Historial de Visitas</h3>
                <div id="visitsListContainer">Cargando...</div>
            </div>

            <!-- Vista Transacciones -->
            <div id="transactionsView" class="view-section">
                <button class="back-btn btnVolver">← Volver</button>
                <h3>Registro de Transacciones</h3>
                <div id="transactionsListContainer">Cargando...</div>
            </div>

            <!-- Vista Buscador / Edición -->
            <div id="searchView" class="view-section">
                <button class="back-btn btnVolver">← Volver</button>
                <h3>Consulta y Gestión de Cliente</h3>
                <div class="input-group">
                    <input type="text" id="cedulaInput" placeholder="Ingresa número de cédula...">
                </div>
                <button class="btn-login" id="btnBuscarCedula" style="margin-bottom: 15px;">Buscar Cliente</button>
                <div id="searchResultContainer"></div>
            </div>
        </div>
    </div>

    <div id="qrReader" style="display: none;"></div>
    <input type="file" id="qrFileInput" accept="image/*" capture="environment" style="display: none;">

    <script>
        const API_URL = "https://nwuqdmbqlpmiyxiqdxmc.supabase.co";
        const API_KEY = "sb_publishable_yxX1XgJScGe_kIA8IucS0w_Viy6Q0bc";
        let userToken = "";
        let html5QrCode = null;

        function mostrarError(txt) {
            const el = document.getElementById('errorMsg');
            if (el) { el.textContent = txt; el.style.display = 'block'; }
        }

        document.getElementById('btnEye').addEventListener('click', () => {
            const pwd = document.getElementById('password');
            pwd.type = pwd.type === 'password' ? 'text' : 'password';
            document.getElementById('btnEye').textContent = pwd.type === 'password' ? '👁️' : '🙈';
        });

        document.getElementById('btnLogin').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim().toLowerCase();
            const pass = document.getElementById('password').value.trim();
            const errDiv = document.getElementById('errorMsg');
            errDiv.style.display = 'none';

            if (!email || !pass) { mostrarError('Ingresa tu correo y contraseña.'); return; }

            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.textContent = 'Verificando...';

            try {
                const res = await fetch(`${API_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: { 'apikey': API_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: pass })
                });

                const data = await res.json();

                if (!res.ok) {
                    mostrarError('Contraseña o correo incorrectos.');
                    btn.disabled = false;
                    btn.textContent = 'Ingresar al Panel';
                    return;
                }

                userToken = data.access_token;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'flex';
                document.getElementById('welcomeName').textContent = 'Hola, ' + email.split('@')[0];

            } catch (e) {
                mostrarError('Error de red al conectar.');
                btn.disabled = false;
                btn.textContent = 'Ingresar al Panel';
            }
        });

        document.getElementById('btnLogout').addEventListener('click', () => {
            location.reload();
        });

        function volverMenu() {
            document.getElementById('homeMenu').style.display = 'flex';
            document.getElementById('clientsView').style.display = 'none';
            document.getElementById('visitsView').style.display = 'none';
            document.getElementById('transactionsView').style.display = 'none';
            document.getElementById('searchView').style.display = 'none';
        }

        document.querySelectorAll('.btnVolver').forEach(b => b.addEventListener('click', volverMenu));

        function linkWA(telRaw, nombre, deuda) {
            if (!telRaw || telRaw === 'Sin teléfono') return '#';
            let tel = telRaw.replace(/\D/g, '');
            if (!tel.startsWith('58') && tel.length === 10) tel = '58' + tel;
            let msg = deuda > 0 
                ? `Hola ${nombre}, te saludamos de El Rincón de Mariana. Te recordamos que tienes un saldo pendiente de $${deuda.toFixed(2)}.`
                : `Hola ${nombre}, te saludamos de El Rincón de Mariana. Tu cuenta está totalmente al día. ¡Gracias!`;
            return `https://wa.me/${tel}?text=${encodeURIComponent(msg)}`;
        }

        // 1. Ver Lista de Clientes
        document.getElementById('menuClientes').addEventListener('click', async () => {
            volverMenu();
            document.getElementById('homeMenu').style.display = 'none';
            document.getElementById('clientsView').style.display = 'block';
            const cont = document.getElementById('clientsListContainer');
            cont.innerHTML = 'Cargando clientes...';

            try {
                const res = await fetch(`${API_URL}/rest/v1/clientes?select=*&order=created_at.desc`, {
                    headers: { 'apikey': API_KEY, 'Authorization': `Bearer ${userToken}` }
                });
                const data = await res.json();

                if (!data || data.length === 0) { cont.innerHTML = '<p>No hay clientes.</p>'; return; }

                let html = '';
                data.forEach(c => {
                    const nom = c.nombre_y_apellido || c.nombre || 'Sin nombre';
                    const tel = c.telefono || 'Sin teléfono';
                    const ced = c.cedula || 'Sin cédula';
                    const pts = c.puntos || 0;
                    const deu = c.deuda_actual ? parseFloat(c.deuda_actual) : 0;
                    const code = c.codigo_qr || `ERM-${ced}`;
                    const qr = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(code)}`;
                    const wa = linkWA(tel, nom, deu);

                    html += `
                    <div class="client-card">
                        <div class="client-main-row">
                            <div class="client-info">
                                <strong>${nom}</strong><br>
                                <small><strong>Cédula:</strong> ${ced}</small><br>
                                <small><strong>Teléfono:</strong> ${tel}</small><br>
                                <small><strong>Deuda:</strong> $${deu.toFixed(2)}</small><br>
                                <small><strong>Visitas:</strong> ${pts}/5</small>
                            </div>
                            <div class="client-qr-box">
                                <img src="${qr}" alt="QR">
                                <div class="client-qr-code">${code}</div>
                            </div>
                        </div>
                        ${tel !== 'Sin teléfono' ? `<a href="${wa}" target="_blank" class="btn-whatsapp">💬 Enviar Estado por WhatsApp</a>` : ''}
                    </div>`;
                });
                cont.innerHTML = html;
            } catch (e) { cont.innerHTML = '<p style="color:red;">Error al cargar datos.</p>'; }
        });

        // 2. Ver Historial de Visitas
        document.getElementById('menuVisitas').addEventListener('click', async () => {
            volverMenu();
            document.getElementById('homeMenu').style.display = 'none';
            document.getElementById('visitsView').style.display = 'block';
            const cont = document.getElementById('visitsListContainer');
            cont.innerHTML = 'Cargando visitas...';

            try {
                const res = await fetch(`${API_URL}/rest/v1/visitas?select=*,clientes(nombre_y_apellido,nombre,telefono,deuda_actual)&order=created_at.desc`, {
                    headers: { 'apikey': API_KEY, 'Authorization': `Bearer ${userToken}` }
                });
                const data = await res.json();

                if (!data || data.length === 0) { cont.innerHTML = '<p>No hay visitas registradas.</p>'; return; }

                let html = '';
                data.forEach(v => {
                    const cli = v.clientes || {};
                    const nom = cli.nombre_y_apellido || cli.nombre || 'Cliente';
                    const tel = cli.telefono || '';
                    const deu = cli.deuda_actual ? parseFloat(cli.deuda_actual) : 0;
                    const wa = linkWA(tel, nom, deu);

                    html += `<div class="data-item">
                        <strong>Cliente:</strong> ${nom} <br>
                        <strong>Monto:</strong> $${v.monto_consumo || 0} | <strong>Tipo:</strong> ${v.tipo || 'normal'}<br>
                        <small>Fecha: ${v.fecha ? new Date(v.fecha).toLocaleString() : 'N/A'}</small><br>
                        <em>Notas: ${v.notas || 'Sin notas'}</em>
                        ${tel ? `<a href="${wa}" target="_blank" class="btn-whatsapp" style="margin-top:8px;">💬 Enviar WhatsApp</a>` : ''}
                    </div>`;
                });
                cont.innerHTML = html;
            } catch (e) { cont.innerHTML = '<p style="color:red;">Error al cargar visitas.</p>'; }
        });

        // 3. Ver Transacciones
        document.getElementById('menuTransacciones').addEventListener('click', async () => {
            volverMenu();
            document.getElementById('homeMenu').style.display = 'none';
            document.getElementById('transactionsView').style.display = 'block';
            const cont = document.getElementById('transactionsListContainer');
            cont.innerHTML = 'Cargando transacciones...';

            try {
                const res = await fetch(`${API_URL}/rest/v1/transacciones?select=*,clientes(nombre_y_apellido,nombre,telefono,deuda_actual)&order=created_at.desc`, {
                    headers: { 'apikey': API_KEY, 'Authorization': `Bearer ${userToken}` }
                });
                const data = await res.json();

                if (!data || data.length === 0) { cont.innerHTML = '<p>No hay transacciones.</p>'; return; }

                let html = '';
                data.forEach(t => {
                    const cli = t.clientes || {};
                    const nom = cli.nombre_y_apellido || cli.nombre || 'Cliente';
                    const tel = cli.telefono || '';
                    const deu = cli.deuda_actual ? parseFloat(cli.deuda_actual) : 0;
                    const wa = linkWA(tel, nom, deu);

                    html += `<div class="data-item">
                        <strong>Cliente:</strong> ${nom} <br>
                        <strong>Tipo:</strong> ${t.tipo || 'General'} | <strong>Monto:</strong> $${t.monto || 0} <br>
                        <small>Fecha: ${t.fecha ? new Date(t.fecha).toLocaleString() : 'N/A'}</small><br>
                        <em>Detalle: ${t.descripcion || 'Sin detalle'}</em>
                        ${tel ? `<a href="${wa}" target="_blank" class="btn-whatsapp" style="margin-top:8px;">💬 Enviar WhatsApp</a>` : ''}
                    </div>`;
                });
                cont.innerHTML = html;
            } catch (e) { cont.innerHTML = '<p style="color:red;">Error al cargar transacciones.</p>'; }
        });

        // 4. Buscar por Cédula / Editar
        document.getElementById('menuBuscador').addEventListener('click', () => {
            volverMenu();
            document.getElementById('homeMenu').style.display = 'none';
            document.getElementById('searchView').style.display = 'block';
            document.getElementById('cedulaInput').value = '';
            document.getElementById('searchResultContainer').innerHTML = '';
        });

        document.getElementById('btnBuscarCedula').addEventListener('click', async () => {
            const ced = document.getElementById('cedulaInput').value.trim();
            const cont = document.getElementById('searchResultContainer
