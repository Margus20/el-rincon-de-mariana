<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - El Rincón de Mariana</title>
    <!-- Importamos Supabase de forma segura -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f4f4f4; min-height: 100vh; display: flex; flex-direction: column; }
        .login-screen { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; background: white; }
        .login-box { width: 100%; max-width: 350px; text-align: center; }
        .login-box h1 { color: #E67E22; margin-bottom: 10px; }
        .login-box p { color: #666; margin-bottom: 25px; font-size: 14px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: bold; }
        .input-group input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        .btn-login { width: 100%; padding: 14px; background: #E67E22; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .error-msg { color: #e74c3c; font-size: 13px; margin-top: 15px; background: #fde8e8; padding: 10px; border-radius: 5px; display: none; }
        
        .dashboard-screen { display: none; flex: 1; flex-direction: column; }
        .header-panel { background: #E67E22; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .welcome-card { background: white; padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .action-btn { width: 100%; padding: 18px; background: white; border: 2px solid #E67E22; border-radius: 10px; color: #E67E22; font-size: 18px; font-weight: bold; cursor: pointer; text-align: center; }
        .action-btn.primary { background: #E67E22; color: white; }
        
        /* Secciones dinámicas para las vistas secundarias */
        .view-section { display: none; background: white; padding: 20px; border-radius: 10px; flex: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .view-section h3 { color: #E67E22; margin-bottom: 15px; }
        .back-btn { background: #666; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-size: 14px; cursor: pointer; margin-bottom: 15px; }
        .client-item { padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; color: #333; }
    </style>
</head>
<body>
    <!-- Pantalla de Login -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h1>El Rincón de Mariana</h1>
            <p>Panel de Control Interno</p>
            <div class="input-group">
                <label>Correo electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com">
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button class="btn-login" onclick="iniciarSesion()">Ingresar al Panel</button>
            <div id="errorMsg" class="error-msg"></div>
        </div>
    </div>
    
    <!-- Pantalla Principal del Panel -->
    <div id="dashboardScreen" class="dashboard-screen">
        <div class="header-panel">
            <h2>Panel de Control</h2>
            <button onclick="cerrarSesion()" style="background:rgba(255,255,255,0.2);border:1px solid white;color:white;padding:6px 12px;border-radius:5px;cursor:pointer;">Salir</button>
        </div>
        
        <div class="main-content">
            <!-- Menú Principal -->
            <div id="homeMenu" style="display: flex; flex-direction: column; gap: 15px; flex: 1;">
                <div class="welcome-card">
                    <h3 id="welcomeName">Bienvenido</h3>
                    <p id="welcomeRole">Cargando...</p>
                </div>
                
                <!-- Botón de Escanear QR (Activa la cámara del teléfono) -->
                <button class="action-btn primary" onclick="abrirEscanerQR()">📷 Escanear Código QR</button>
                
                <!-- Botón de Lista de Clientes -->
                <button class="action-btn" onclick="verListaClientes()">👥 Ver Lista de Clientes</button>
                
                <!-- Botón de Buscar por Cédula -->
                <button class="action-btn" onclick="abrirBuscadorCedula()">🔍 Buscar por Cédula</button>
            </div>

            <!-- Vista: Clientes -->
            <div id="clientsView" class="view-section">
                <button class="back-btn" onclick="volverAlMenu()">← Volver</button>
                <h3>Lista de Clientes</h3>
                <div id="clientsListContainer">Cargando clientes...</div>
            </div>

            <!-- Vista: Buscar por Cédula -->
            <div id="searchView" class="view-section">
                <button class="back-btn" onclick="volverAlMenu()">← Volver</button>
                <h3>Buscar Cliente por Cédula</h3>
                <div class="input-group">
                    <input type="text" id="cedulaInput" placeholder="Introduce la cédula...">
                </div>
                <button class="btn-login" onclick="buscarCedula()" style="margin-bottom: 15px;">Buscar</button>
                <div id="searchResultContainer"></div>
            </div>
        </div>
    </div>

    <!-- Input oculto para activar la cámara del móvil y escanear imágenes/QR -->
    <input type="file" id="qrFileInput" accept="image/*" capture="environment" style="display: none;" onchange="procesarArchivoQR(event)">

    <script>
        const SUPABASE_URL = 'https://nwuqdmbqlpmiyxiqdxmc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_yxX1XgJScGe_kIA8IucS0w_Viy6Q0bc';
        
        let db = null;

        window.addEventListener('DOMContentLoaded', () => {
            try {
                if (window.supabase) {
                    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                } else {
                    mostrarError('No se pudo cargar la librería de autenticación.');
                }
            } catch (e) {
                mostrarError('Error de inicialización: ' + e.message);
            }
        });

        function mostrarError(msg) {
            const errorDiv = document.getElementById('errorMsg');
            if (errorDiv) {
                errorDiv.textContent = msg;
                errorDiv.style.display = 'block';
            }
        }

        async function iniciarSesion() {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            if (!db) {
                mostrarError('El sistema no está conectado con la base de datos.');
                return;
            }

            const emailInput = document.getElementById('email').value.trim().toLowerCase();
            const passwordInput = document.getElementById('password').value.trim();

            if (!emailInput || !passwordInput) {
                mostrarError('Por favor, completa todos los campos.');
                return;
            }

            try {
                const { data: authData, error: authError } = await db.auth.signInWithPassword({
                    email: emailInput,
                    password: passwordInput
                });

                if (authError) {
                    mostrarError('Error de Autenticación: ' + authError.message);
                    return;
                }

                const { data: emp, error: empError } = await db
                    .from('empleados')
                    .select('nombre, email')
                    .eq('email', emailInput)
                    .maybeSingle();

                if (empError) {
                    mostrarError('Error en tabla empleados: ' + empError.message);
                    await db.auth.signOut();
                    return;
                }

                if (!emp) {
                    mostrarError('El correo "' + emailInput + '" no se encontró en la tabla empleados.');
                    await db.auth.signOut();
                    return;
                }

                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'flex';
                document.getElementById('welcomeName').textContent = 'Hola, ' + emp.nombre;
                document.getElementById('welcomeRole').textContent = 'Panel de Control Activo';

            } catch (err) {
                mostrarError('Excepción imprevista: ' + err.message);
            }
        }

        async function cerrarSesion() {
            if (db) {
                await db.auth.signOut();
            }
            document.getElementById('dashboardScreen').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            document.getElementById('errorMsg').style.display = 'none';
            volverAlMenu();
        }

        // --- FUNCIONES DE NAVEGACIÓN Y BOTONES ---

        function volverAlMenu() {
            document.getElementById('homeMenu').style.display = 'flex';
            document.getElementById('clientsView').style.display = 'none';
            document.getElementById('searchView').style.display = 'none';
        }

        // 1. Escanear Código QR (Abre la cámara del móvil para tomar foto o escanear)
        function abrirEscanerQR() {
            document.getElementById('qrFileInput').click();
        }

        function procesarArchivoQR(event) {
            const file = event.target.files[0];
            if (file) {
                alert("Imagen capturada correctamente. Aquí puedes procesar el código QR o asociarlo al cliente.");
            }
        }

        // 2. Ver Lista de Clientes (Consulta la tabla 'clientes' en Supabase)
        async function verListaClientes() {
            document.getElementById('homeMenu').style.display = 'none';
            document.getElementById('clientsView').style.display = 'block';
            const container = document.getElementById('clientsListContainer');
            container.innerHTML = 'Cargando clientes...';

            try {
                const { data: clientes, error } = await db
                    .from('clientes')
                    .select('*')
                    .limit(50);

                if (error) {
                    container.innerHTML = 'Error al cargar clientes: ' + error.message;
                    return;
                }

                if (!clientes || clientes.length === 0) {
                    container.innerHTML = '<p>No hay clientes registrados todavía.</p>';
                    return;
                }

                let html = '';
                clientes.forEach(c => {
                    html += `<div class="client-item"><strong>${c.nombre || 'Sin nombre'}</strong> - ${c.email || c.telefono || 'Sin contacto'}</div>`;
                });
                container.innerHTML = html;

            } catch (err) {
                container.innerHTML = 'Error de conexión al buscar clientes.';
            }
        }

        // 3. Buscar por Cédula
        function abrirBuscadorCedula() {
            document.getElementById('homeMenu').style.display = 'none';
            document.getElementById('searchView').style.display = 'block';
            document.getElementById('cedulaInput').value = '';
            document.getElementById('searchResultContainer').innerHTML = '';
        }

        async function buscarCedula() {
            const cedula = document.getElementById('cedulaInput').value.trim();
            const resultContainer = document.getElementById('searchResultContainer');

            if (!cedula) {
                resultContainer.innerHTML = '<p style="color:red;">Por favor, introduce una cédula.</p>';
                return;
            }

            resultContainer.innerHTML = 'Buscando...';

            try {
                // Asumiendo que en tu tabla 'clientes' tienes una columna llamada 'cedula' o similar
                const { data, error } = await db
                    .from('clientes')
                    .select('*')
                    .eq('cedula', cedula)
                    .maybeSingle();

                if (error) {
                    resultContainer.innerHTML = 'Error en la búsqueda: ' + error.message;
                    return;
                }

                if (!data) {
                    resultContainer.innerHTML = '<p>No se encontró ningún cliente con esa cédula.</p>';
                    return;
                }

                resultContainer.innerHTML = `
                    <div style="background: #fdf8f2; padding: 12px; border-radius: 8px; border: 1px solid #E67E22;">
                        <p><strong>Nombre:</strong> ${data.nombre}</p>
                        <p><strong>Cédula:</strong> ${data.cedula}</p>
                        <p><strong>Teléfono:</strong> ${data.telefono || 'No registrado'}</p>
                    </div>
                `;

            } catch (err) {
                resultContainer.innerHTML = 'Error al procesar la búsqueda.';
            }
        }
    </script>
</body>
</html>
